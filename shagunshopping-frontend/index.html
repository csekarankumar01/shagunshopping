<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Genuine skincare, haircare and makeup from 18 trusted brands, priced below MRP. Cash on delivery available. Ships across India."
    />
    <title>ShagunShopping — Genuine beauty, below MRP</title>
    
    <!-- Optimize Google Fonts Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400;500;600;700;800&display=optional">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400;500;600;700;800&display=optional" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..900;1,400..900&family=Manrope:wght@400;500;600;700;800&display=optional">
    </noscript>
    
    <!-- Optimize Backend API Connection & Instant Pre-warm -->
    <link rel="dns-prefetch" href="https://shagunshopping.onrender.com">
    <link rel="preconnect" href="https://shagunshopping.onrender.com" crossorigin>
    <script>
      (function() {
        try {
          var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          var origin = isLocal ? '' : 'https://shagunshopping.onrender.com';
          if (origin) {
            fetch(origin + '/api/health', { mode: 'cors', keepalive: true }).catch(function(){});
          }
        } catch(e) {}
      })();
    </script>
    
    <link rel="preload" as="image" href="/shagun_storefront.jpg" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
