services:
  # ----------------------------------------------------
  # UAT Frontend Storefront (React SPA on port 3001)
  # ----------------------------------------------------
  uat-frontend:
    build:
      context: ./shagunshopping-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5002/api
        VITE_CMS_URL: http://localhost:1338
    container_name: shagunshopping-uat-frontend
    ports:
      - "3001:80"
    restart: unless-stopped
    depends_on:
      uat-backend:
        condition: service_healthy

  # ----------------------------------------------------
  # UAT Backend API (Node.js 20 Express on port 5002)
  # ----------------------------------------------------
  uat-backend:
    build:
      context: ./backend-shagunshopping
      dockerfile: Dockerfile
    container_name: shagunshopping-uat-backend
    ports:
      - "5002:5001"
    restart: unless-stopped
    environment:
      PORT: 5001
      NODE_ENV: staging
      MONGO_URI: mongodb://uat-mongo:27017/shagunshopping_uat
      REDIS_URL: redis://uat-redis:6379/1
      KAFKA_BROKERS: uat-kafka:9092
      CLIENT_URL: http://localhost:3001
      SHOP_NAME: "ShagunShopping [UAT Staging]"
      RECONCILIATION_INTERVAL_MS: "60000" # 1 min fast reconciliation for rapid testing
    depends_on:
      uat-mongo:
        condition: service_healthy
      uat-redis:
        condition: service_healthy
      uat-kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # UAT Strapi CMS (Marketing & Content on port 1338)
  # ----------------------------------------------------
  uat-cms:
    build:
      context: ./cms-shagunshopping
      dockerfile: Dockerfile
    container_name: shagunshopping-uat-cms
    ports:
      - "1338:1337"
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: staging
      DATABASE_FILENAME: .tmp/uat_data.db
    volumes:
      - uat_cms_data:/opt/app/.tmp
    restart: unless-stopped

  # ----------------------------------------------------
  # UAT Isolated MongoDB
  # ----------------------------------------------------
  uat-mongo:
    image: mongo:7.0
    container_name: shagunshopping-uat-mongo
    ports:
      - "27018:27017"
    volumes:
      - uat_mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # UAT Isolated Redis
  # ----------------------------------------------------
  uat-redis:
    image: redis:7-alpine
    container_name: shagunshopping-uat-redis
    ports:
      - "6380:6379"
    volumes:
      - uat_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # UAT Kafka & Kraft Broker
  # ----------------------------------------------------
  uat-kafka:
    image: apache/kafka:3.7.0
    container_name: shagunshopping-uat-kafka
    ports:
      - "9095:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://uat-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@uat-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 2
    volumes:
      - uat_kafka_data:/tmp/kraft-combined-logs
    restart: unless-stopped

volumes:
  uat_mongo_data:
  uat_redis_data:
  uat_kafka_data:
  uat_cms_data:

