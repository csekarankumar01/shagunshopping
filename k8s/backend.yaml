apiVersion: apps/v1
kind: Deployment
metadata:
  name: shagunshopping-backend
  namespace: shagunshopping
  labels:
    app: shagunshopping-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shagunshopping-backend
  template:
    metadata:
      labels:
        app: shagunshopping-backend
    spec:
      containers:
        - name: backend-api
          image: shagunshopping-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef:
                name: shagunshopping-config
            - secretRef:
                name: shagunshopping-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: shagunshopping-backend
  namespace: shagunshopping
spec:
  selector:
    app: shagunshopping-backend
  ports:
    - port: 5001
      targetPort: 5001

