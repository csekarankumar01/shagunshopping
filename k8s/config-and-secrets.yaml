apiVersion: v1
kind: ConfigMap
metadata:
  name: shagunshopping-config
  namespace: shagunshopping
data:
  NODE_ENV: "production"
  PORT: "5001"
  CLIENT_URL: "https://shagunshopping.com"
  REDIS_URL: "redis://shagunshopping-redis:6379"
  KAFKA_BROKERS: "shagunshopping-kafka:9092"
  ENABLE_KAFKA_CONSUMERS: "true"
  SHOP_NAME: "ShagunShopping"
  OWNER_EMAIL: "shagunshopping.meerut@gmail.com"
  FREE_SHIPPING_ABOVE: "1499"
  FREE_SHIPPING_ABOVE_PREPAID: "1199"
  SHIPPING_FEE: "49"
  COD_FEE: "0"
  COD_MAX: "2500"
---
apiVersion: v1
kind: Secret
metadata:
  name: shagunshopping-secrets
  namespace: shagunshopping
type: Opaque
stringData:
  MONGO_URI: "mongodb+srv://<USER>:<PASSWORD>@<CLUSTER>.mongodb.net/?appName=ShagunShopping"
  JWT_SECRET: "<REPLACE_WITH_PRODUCTION_JWT_SECRET>"
  RAZORPAY_KEY_ID: "<REPLACE_WITH_RAZORPAY_KEY_ID>"
  RAZORPAY_KEY_SECRET: "<REPLACE_WITH_RAZORPAY_KEY_SECRET>"
  RAZORPAY_WEBHOOK_SECRET: "<REPLACE_WITH_RAZORPAY_WEBHOOK_SECRET>"
  RESEND_API_KEY: "<REPLACE_WITH_RESEND_API_KEY>"
  TURNSTILE_SECRET_KEY: "<REPLACE_WITH_TURNSTILE_SECRET_KEY>"

