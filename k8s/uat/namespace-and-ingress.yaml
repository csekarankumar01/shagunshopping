apiVersion: v1
kind: Namespace
metadata:
  name: shagunshopping-uat
  labels:
    environment: uat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shagunshopping-config
  namespace: shagunshopping-uat
data:
  NODE_ENV: "staging"
  PORT: "5001"
  CLIENT_URL: "https://uat.shagunshopping.com"
  REDIS_URL: "redis://shagunshopping-redis.shagunshopping-uat.svc.cluster.local:6379/1"
  KAFKA_BROKERS: "shagunshopping-kafka.shagunshopping-uat.svc.cluster.local:9092"
  ENABLE_KAFKA_CONSUMERS: "true"
  SHOP_NAME: "ShagunShopping [UAT Sandbox]"
  OWNER_EMAIL: "uat-testing@shagunshopping.com"
  FREE_SHIPPING_ABOVE: "1499"
  FREE_SHIPPING_ABOVE_PREPAID: "1199"
  SHIPPING_FEE: "49"
  COD_FEE: "0"
  COD_MAX: "2500"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shagunshopping-uat-ingress
  namespace: shagunshopping-uat
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - uat.shagunshopping.com
        - uat-api.shagunshopping.com
      secretName: shagunshopping-uat-tls
  rules:
    - host: uat.shagunshopping.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shagunshopping-frontend
                port:
                  number: 80
    - host: uat-api.shagunshopping.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shagunshopping-backend
                port:
                  number: 5001

