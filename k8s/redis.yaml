apiVersion: apps/v1
kind: Deployment
metadata:
  name: shagunshopping-redis
  namespace: shagunshopping
  labels:
    app: shagunshopping-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shagunshopping-redis
  template:
    metadata:
      labels:
        app: shagunshopping-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shagunshopping-redis
  namespace: shagunshopping
spec:
  selector:
    app: shagunshopping-redis
  ports:
    - port: 6379
      targetPort: 6379

